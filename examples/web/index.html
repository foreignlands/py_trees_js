<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>PyTrees JS Web Example</title>
  <link rel="stylesheet" href="../../js/py_trees-0.6.css"/>
  <link rel="stylesheet" href="../../js/jointjs/joint-3.0.4.min.css"/>
  <script src="../../js/jointjs/dagre-0.8.4.min.js"></script>
  <script src="../../js/jointjs/graphlib-2.1.7.min.js"></script>
  <script src="../../js/jointjs/jquery-3.4.1.min.js"></script>
  <script src="../../js/jointjs/lodash-4.17.11.min.js"></script>
  <script src="../../js/jointjs/backbone-1.4.0.js"></script>
  <script src="../../js/jointjs/joint-3.0.4.min.js"></script>
  <script src="../../js/py_trees-0.6.js"></script>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: sans-serif;
    }
    #toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 8px 12px;
      border-bottom: 1px solid #ddd;
      background: #fafafa;
    }
    #viewer {
      height: calc(100% - 42px);
    }
    #canvas {
      height: 70%;
    }
    #timeline {
      height: 30%;
      border-top: 1px solid #ddd;
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <button id="render">Render demo tree</button>
    <span id="status">Waiting…</span>
  </div>
  <div id="viewer">
    <div id="canvas"></div>
    <div id="timeline"></div>
  </div>

  <script>
    py_trees.hello();

    const canvas_graph = py_trees.canvas.create_graph();
    const canvas_paper = py_trees.canvas.create_paper({graph: canvas_graph});

    const timeline_graph = py_trees.timeline.create_graph({event_cache_limit: 100});
    const timeline_paper = py_trees.timeline.create_paper({
      timeline_graph,
      canvas_graph,
      canvas_paper,
    });

    $(window).resize(function() {
      py_trees.canvas.on_window_resize(canvas_paper);
      py_trees.timeline.on_window_resize(timeline_paper);
    });

    window.render_tree = function({tree}) {
      py_trees.timeline.add_tree_to_cache({
        timeline_graph,
        canvas_graph,
        canvas_paper,
        tree,
      });
      document.getElementById('status').innerText = `Rendered timestamp: ${tree.timestamp}`;
      return 'rendered';
    }

    document.getElementById('render').addEventListener('click', function() {
      const tree = py_trees.experimental.create_demo_tree_definition();
      tree.timestamp = Math.floor(Date.now() / 1000);
      window.render_tree({tree});
    });

    document.getElementById('render').click();
  </script>
</body>
</html>
